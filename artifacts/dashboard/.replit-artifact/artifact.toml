kind = "web"
previewPath = "/"
title = "Cart-to-WhatsApp Dashboard"
description = "The merchant-facing dashboard for the Cart-to-WhatsApp abandonment recovery widget. Store owners sign up, log in, configure their WhatsApp/SMS recovery settings, copy their install snippet, and review captured cart-recovery leads."
version = "1.0.0"
id = "artifacts/dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23183

[services.development]
run = "pnpm --filter @workspace/dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23183"
BASE_PATH = "/"
